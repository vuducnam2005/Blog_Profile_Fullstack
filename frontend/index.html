<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Oxanium:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
    <title>Vũ Đức Nam (ducnamdev) | Personal Blog & Portfolio</title>

    <!-- Tối ưu SEO cơ bản -->
    <meta name="description"
        content="Blog cá nhân và Portfolio của Vũ Đức Nam (ducnamdev). Chia sẻ kiến thức lập trình, kinh nghiệm học tập Fullstack Development, C#, React và các dự án cá nhân nổi bật.">
    <meta name="keywords"
        content="Vũ Đức Nam, ducnamdev, lập trình, blog cá nhân, fullstack, portfolio, react, .net, C#">
    <meta name="author" content="Vũ Đức Nam">
    <link rel="canonical" href="https://ducnamdev.site/" />

    <!-- Open Graph (Ví dụ cho Facebook, Zalo, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ducnamdev.site/">
    <meta property="og:title" content="Vũ Đức Nam (ducnamdev) | Portfolio & Personal Blog">
    <meta property="og:description" content="Khám phá các dự án, bài viết và hành trình lập trình của Vũ Đức Nam.">
    <!-- <meta property="og:image" content="https://ducnamdev.site/hinh-anh-hien-thi-khi-share.png"> -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Nền gradient cố định tách riêng thành GPU layer, không dùng background-attachment: fixed để iOS Safari cuộn 60-120fps */
        .page-gradient-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(160, 120, 30, 0.15) 0%, transparent 50%),
                radial-gradient(circle at top left, #0b1a1c 0%, #000000 70%);
            background-size: cover;
            pointer-events: none;
            z-index: -1;
            transform: translateZ(0);
        }

        /* Canvas bao phủ toàn bộ màn hình CỐ ĐỊNH PHÍA SAU */
        #webgl-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            /* Không chặn chuột — cho phép click xuyên qua */
        }

        /* Cục DOM của React */
        #root {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            pointer-events: none;
            /* Để chuột xuyên qua vùng trống xuống background */
        }
    </style>
</head>

<body>

    <!-- Nền gradient cố định tăng tốc phần cứng cho Safari / Mobile -->
    <div class="page-gradient-bg" aria-hidden="true"></div>

    <!-- App React đè lên trên (Bắt buộc phải có thẻ tên root này) -->
    <div id="root"></div>

    <!-- Khởi chạy ứng dụng React -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Three.js Black Hole Background -->
    <!-- Three.js background starts from src/main.jsx with Worker/fallback support. -->
</body>

</html>
